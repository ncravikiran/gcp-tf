name: Terraform Drift Detection (qa)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: gcp-simple-infra/envs/qa
  TF_IN_AUTOMATION: true

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.14.7"

      - uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" init -input=false -no-color

      # ---------------------------------------------------------
      # 1. Create refresh-only plan
      # ---------------------------------------------------------
      - name: Terraform Refresh Plan
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" plan \
            -refresh-only \
            -out=tfplan \
            -input=false \
            -no-color

      # ---------------------------------------------------------
      # 2. Capture raw show output (NOT JSON-safe)
      # ---------------------------------------------------------
      - name: Capture Terraform Show Output
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" show -json tfplan \
            > raw-output.txt || true

      # ---------------------------------------------------------
      # 3. Extract JSON safely (production hardened)
      # ---------------------------------------------------------
      - name: Extract Valid JSON
        run: |
          python3 <<'EOF'
          import json, re, sys

          with open("raw-output.txt", "r") as f:
              data = f.read()

          # Find first JSON object
          match = re.search(r'\{.*', data, re.S)
          if not match:
              print("❌ No JSON object found in terraform output")
              sys.exit(1)

          json_text = match.group(0)

          try:
              parsed = json.loads(json_text)
          except Exception as e:
              print("❌ Found JSON but failed to parse:", e)
              sys.exit(1)

          with open("plan.json", "w") as f:
              json.dump(parsed, f)

          print("✅ Valid JSON extracted successfully")
          EOF

      # ---------------------------------------------------------
      # 4. Detect drift (authoritative)
      # ---------------------------------------------------------
      - name: Detect Drift
        run: |
          DRIFT_COUNT=$(jq '.resource_changes | length' plan.json)

          echo "Detected resource changes: $DRIFT_COUNT"

          if [ "$DRIFT_COUNT" -gt 0 ]; then
            echo "❗ DRIFT DETECTED IN QA"
            exit 1
          else
            echo "✔ No drift detected in QA"
          fi
