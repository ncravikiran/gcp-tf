name: Terraform Drift Detection (qa)

on:
  schedule:
    - cron: "0 */12 * * *"   # Every 12 hours
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: gcp-simple-infra/envs/qa
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.14.7"

      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Configure gcloud
        run: |
          gcloud config set project "${{ env.GCP_PROJECT }}"
          gcloud config set compute/region "${{ env.GCP_REGION }}"
          gcloud config set compute/zone "${{ env.GCP_ZONE }}"

      - name: Terraform Init (Remote State)
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" init -input=false

      #
      # Run plan and allow exit code 2 without failing the job
      #
      - name: Terraform Plan (Drift Detection)
        id: plan
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" plan \
            -detailed-exitcode \
            -no-color
        continue-on-error: true

      #
      # Interpret terraform exit code
      #
      - name: Evaluate Drift Result
        run: |
          EXIT_CODE=${{ steps.plan.outcome }}

          if [ "${{ steps.plan.conclusion }}" = "failure" ]; then
            echo "❌ Terraform error during plan"
            exit 1
          fi

          if [ "${{ steps.plan.conclusion }}" = "success" ]; then
            echo "✔ No drift detected in QA"
            exit 0
          fi

          echo "❗ DRIFT DETECTED IN QA"
          exit 1
