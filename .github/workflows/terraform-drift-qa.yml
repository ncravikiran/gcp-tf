name: Terraform Drift Detection (qa)

on:
  schedule:
    - cron: "0 */1 * * *"   # Every 6 hours
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: gcp-simple-infra/envs/qa
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: "1.14.7"

    - name: Authenticate GCP
      uses: google-github-actions/auth@v1
      with:
        workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

     - name: Configure gcloud
      run: |
        gcloud config set project "${{ secrets.GCP_PROJECT }}"
        gcloud config set compute/region "${{ secrets.GCP_REGION }}"
         gcloud config set compute/zone "${{ secrets.GCP_ZONE }}"
         
    - name: Terraform init (state, backend)
      run: terraform -chdir="${{ env.TF_WORKING_DIR }}" init -input=false -migrate-state

    - name: Terraform Plan (Drift Detection)
      run: |
        set +e
        terraform -chdir="${{ env.TF_WORKING_DIR }}" plan -detailed-exitcode -no-color
        echo "exitcode=$?" >> $GITHUB_OUTPUT
        set -e

    - name: Detect Drift & Fail If Found
      run: |
        if [ "${{ steps.drift.outputs.exitcode }}" = "2" ]; then
          echo "❗ DRIFT DETECTED IN QA"
          exit 1
        else
          echo "✔ No drift detected"
        fi

