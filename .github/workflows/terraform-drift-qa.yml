name: Terraform Drift Detection (QA)
 
on:
  schedule:
    - cron: '0 6 * * *'   # daily at 6AM UTC
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
env:
  TF_WORKING_DIR: gcp-simple-infra/envs/qa
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
 
jobs:
  detect-drift:
    name: Detect Terraform Drift
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.14.7"
 
      - name: Authenticate GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
 
      - name: Configure gcloud
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT }}
          gcloud config set compute/region ${{ secrets.GCP_REGION }}
          gcloud config set compute/zone ${{ secrets.GCP_ZONE }}
 
      - name: Terraform Init (GCS backend)
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" init \
            -input=false \
            -migrate-state
 
      # KEY POINT: -detailed-exitcode gives us:
      #   exit 0 → no changes (no drift)
      #   exit 1 → terraform error (real failure)
      #   exit 2 → changes detected = DRIFT
      # Without capturing this, exit 2 would kill the job
      # and you'd never know WHY it failed.
      - name: Terraform Plan (Drift Check)
        id: plan
        run: |
          set +e
          terraform -chdir="${{ env.TF_WORKING_DIR }}" plan \
            -input=false \
            -detailed-exitcode \
            -out=tfplan 2>&1 | tee plan_output.txt
          EXITCODE=${PIPESTATUS[0]}
          echo "exitcode=$EXITCODE" >> $GITHUB_OUTPUT
 
          if [ $EXITCODE -eq 1 ]; then
            echo "❌ Terraform plan failed with an error."
            exit 1
          elif [ $EXITCODE -eq 2 ]; then
            echo "⚠️ DRIFT DETECTED — infrastructure has changed outside of Terraform."
            exit 0   # don't fail the job; let the next step report it
          else
            echo "✅ No drift detected."
          fi
 
      - name: Report Drift
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "### ⚠️ Drift Detected in QA" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Optionally fail the job AFTER reporting, so the summary is visible
          exit 1
 
      - name: No Drift
        if: steps.plan.outputs.exitcode == '0'
        run: |
          echo "### ✅ No Drift Detected in QA" >> $GITHUB_STEP_SUMMARY
