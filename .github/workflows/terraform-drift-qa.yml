name: Terraform Drift Detection (qa)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: gcp-simple-infra/envs/qa
  TF_IN_AUTOMATION: true
  TF_LOG: ERROR

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.14.7"

      - uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" init \
            -input=false \
            -no-color

      # ------------------------------------------------------------
      # 1. Create refresh-only plan (NO stdout noise)
      # ------------------------------------------------------------
      - name: Terraform Refresh Plan
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" plan \
            -refresh-only \
            -out=tfplan \
            -input=false \
            -no-color

      # ------------------------------------------------------------
      # 2. Convert plan to STRICT JSON only
      # ------------------------------------------------------------
      - name: Convert Plan to JSON
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" show \
            -json tfplan \
            > plan.json

      # ------------------------------------------------------------
      # 3. Validate JSON before parsing
      # ------------------------------------------------------------
      - name: Validate Plan JSON
        run: |
          if ! jq empty plan.json; then
            echo "❌ terraform show did NOT produce valid JSON"
            echo "---- First 20 lines of output ----"
            sed -n '1,20p' plan.json
            exit 1
          fi

      # ------------------------------------------------------------
      # 4. Detect Drift (authoritative)
      # ------------------------------------------------------------
      - name: Detect Drift
        run: |
          DRIFT_COUNT=$(jq '.resource_changes | length' plan.json)

          echo "Detected resource changes: $DRIFT_COUNT"

          if [ "$DRIFT_COUNT" -gt 0 ]; then
            echo "❗ DRIFT DETECTED IN QA"
            exit 1
          else
            echo "✔ No drift detected in QA"
          fi
