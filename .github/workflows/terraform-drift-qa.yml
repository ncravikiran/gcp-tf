name: Terraform Drift Detection (qa)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: gcp-simple-infra/envs/qa
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.14.7"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" init -input=false

      - name: Terraform Drift Detection
        run: |
          set +e
          terraform -chdir="${{ env.TF_WORKING_DIR }}" plan \
            -detailed-exitcode \
            -no-color
          EXIT_CODE=$?
          set -e

          echo "Terraform exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "❗ DRIFT DETECTED IN QA"
            exit 1
          elif [ "$EXIT_CODE" -eq 1 ]; then
            echo "❌ Terraform error"
            exit 1
          else
            echo "✔ No drift detected in QA"
            exit 0
          fi
