name: Terraform Drift)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: gcp-simple-infra/envs/qa

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.14.7"

      - uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" init -input=false

      # --------------------------------------------------
      # ✅ DRIFT DETECTION (THE ONLY RELIABLE METHOD)
      # --------------------------------------------------
      - name: Terraform Refresh Plan (JSON)
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" plan \
            -refresh-only \
            -json > plan.json

      - name: Detect Drift (Parse JSON)
        run: |
          CHANGES=$(jq '.resource_changes | length' plan.json)

          echo "Detected resource changes: $CHANGES"

          if [ "$CHANGES" -gt 0 ]; then
            echo "❗ DRIFT DETECTED IN QA"
            exit 1
          else
            echo "✔ No drift detected in QA"
          fi
