name Detection (qa)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: gcp-simple-infra/envs/qa
  TF_IN_AUTOMATION: true

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.14.7"

      - uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" init -input=false -no-color

      - name: Terraform Refresh-Only Plan
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" plan \
            -refresh-only \
            -out=tfplan \
            -input=false \
            -no-color

      # ==========================================================
      # ✅ Canonical JSON extraction (THIS IS THE KEY)
      # ==========================================================
      - name: Extract Valid Plan JSON
        run: |
          terraform -chdir="${{ env.TF_WORKING_DIR }}" show -json tfplan > show.out

          python3 <<'PY'
          import json

          with open("show.out", "r") as f:
              data = f.read()

          # ✅ Terraform may emit text before/after JSON.
          # ✅ The LAST JSON object is always the real plan.
          start = data.rfind("{")
          if start == -1:
              raise SystemExit("❌ No JSON object found in terraform output")

          plan = json.loads(data[start:])

          with open("plan.json", "w") as f:
              json.dump(plan, f)

          print("✅ Valid Terraform plan JSON extracted")
          PY

      # ==========================================================
      # ✅ Drift detection (authoritative)
      # ==========================================================
      - name: Detect Drift
        run: |
          DRIFT_COUNT=$(jq '.resource_changes | length' plan.json)

          echo "Detected resource changes: $DRIFT_COUNT"

          if [ "$DRIFT_COUNT" -gt 0 ]; then
            echo "❗ DRIFT DETECTED IN QA"
            exit 1
          else
            echo "✔ No drift detected in QA"
          fi
