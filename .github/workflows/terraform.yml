name: Terraform (GCP)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: gcp-simple-infra
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  fmt-validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.14.7"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive "${{ env.TF_WORKING_DIR }}"

      - name: Terraform init
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" init -backend=false

      - name: Terraform validate
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" validate

  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: fmt-validate
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.14.7"

      - name: Authenticate GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Configure gcloud
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT }}"
          gcloud config set compute/region "${{ secrets.GCP_REGION }}"
          gcloud config set compute/zone "${{ secrets.GCP_ZONE }}"

      - name: Terraform init (state, backend)
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" init

      - name: Terraform plan
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" plan -out=tfplan

      - name: Save plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: gcp-simple-infra/tfplan

  apply:
    name: terraform apply
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.14.7"

      - name: Authenticate GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform init
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" init

      - name: Terraform plan (rebuild plan for exact match)
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" plan -out=tfplan

      - name: Terraform apply
        run: terraform -chdir="${{ env.TF_WORKING_DIR }}" apply -auto-approve tfplan
