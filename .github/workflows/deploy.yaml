name: Apply Crossplane Remediation

on:
  pull_request:
    branches: 
      - agent
    types: [closed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_LOCATION: ${{ secrets.GKE_LOCATION }}

jobs:
  apply:
    name: Apply YAML via Crossplane
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ✅ SAME AUTH YOU ARE USING (this fixes your issue)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # ✅ Install gcloud
      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      # ✅ Configure project
      - name: Configure gcloud
        run: |
          gcloud config set project "${{ env.GCP_PROJECT }}"
          gcloud config set compute/region "${{ env.GCP_REGION }}"
          gcloud config set compute/zone "${{ env.GCP_ZONE }}"

      # ✅ Get GKE credentials (IMPORTANT)
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ env.GKE_CLUSTER }}" \
            --zone "${{ env.GKE_LOCATION }}" \
            --project "${{ env.GCP_PROJECT }}"

      # ✅ Verify cluster access
      - name: Verify cluster
        run: |
          kubectl get nodes

      # ✅ Apply Crossplane YAML generated by your agent
      - name: Apply remediation YAML
        run: |
          kubectl apply -f remediations/fix.yaml

      # ✅ Debug (optional)
      - name: Check resources
        run: |
          kubectl get managed
