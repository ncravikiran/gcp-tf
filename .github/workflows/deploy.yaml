name: Apply Crossplane Remediation
 
on:
  pull_request:
    branches:
      - agent
    types: [closed]
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_LOCATION: ${{ secrets.GKE_LOCATION }}
 
jobs:
  apply:
    name: Apply YAML via Crossplane
    runs-on: ubuntu-latest
 
    # Only run on an actual MERGE to 'agent', or a manual trigger.
    # Without this guard, closing a PR WITHOUT merging would still apply/delete
    # real infrastructure - this is what enforces "no change without review".
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Explicitly check out 'agent' (the post-merge state), rather than
          # relying on the PR's transient merge-preview ref.
          ref: agent
 
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
 
      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v1
 
      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
 
      - name: Configure gcloud
        run: |
          gcloud config set project "${{ env.GCP_PROJECT }}"
          gcloud config set compute/region "${{ env.GCP_REGION }}"
          gcloud config set compute/zone "${{ env.GCP_ZONE }}"
 
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ env.GKE_CLUSTER }}" \
            --zone "${{ env.GKE_LOCATION }}" \
            --project "${{ env.GCP_PROJECT }}"
 
      - name: Verify cluster
        run: |
          kubectl get nodes
 
      # Apply every remediation manifest first (this is what lets Crossplane
      # Observe/import a resource it's never managed before - no new cloud
      # resource gets created since "Create" isn't in managementPolicies).
      #
      # Then, ONLY for manifests explicitly tagged remediation.io/action: delete
      # (e.g. unattached disks), wait for Ready and delete - that delete is what
      # triggers the real GCP API call. Manifests without that tag (bucket
      # policy fixes, firewall restrictions) are applied and left in place,
      # since those fixes are meant to be permanently enforced by Crossplane.
      - name: Apply remediations, then delete anything marked for deletion
        run: |
          for f in remediations/*.yaml; do
            echo "Applying $f"
            kubectl apply -f "$f"
          done
 
          for f in remediations/*.yaml; do
            if grep -q 'remediation.io/action: delete' "$f"; then
              echo "$f is marked for deletion - checking sync status first"
 
              # Give Crossplane a short window to reconcile, then inspect WHY
              # it isn't synced rather than blindly waiting until timeout.
              kubectl wait --for=condition=Synced -f "$f" --timeout=60s || true
 
              message=$(kubectl get -f "$f" -o jsonpath='{.status.conditions[?(@.type=="Synced")].message}' 2>/dev/null || echo "")
              echo "Synced condition message: $message"
 
              if echo "$message" | grep -qiE "not found|404"; then
                echo "Underlying GCP resource doesn't exist - nothing to delete in the cloud."
                echo "Removing the local manifest object only."
                kubectl delete -f "$f" --ignore-not-found
                continue
              fi
 
              echo "Resource exists in GCP - waiting for Ready before deleting"
              kubectl wait --for=condition=Ready -f "$f" --timeout=120s
              kubectl delete -f "$f"
            fi
          done
 
      - name: Check resources
        run: |
          kubectl get managed
