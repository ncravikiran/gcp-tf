steps:
 
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-to-vm'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh ${_VM_USER}@${_VM_NAME} \
          --zone=${_VM_ZONE} \
          --tunnel-through-iap \
          --ssh-flag="-o StrictHostKeyChecking=no" \
          --ssh-flag="-o RequestTTY=force" \
          --command='
            set -e
            echo "===== Deployment started ====="
 
            sudo rm -rf /opt/app
            sudo git clone https://github.com/ncravikiran/gcp-tf.git /opt/app
            cd /opt/app
            sudo git checkout cloud-build
            cd /opt/app/sample-code
 
            sudo npm install
 
            set -a
            source /opt/app.env
            set +a
 
            sudo pm2 delete gcp-tf-sample-app || true
            sudo pm2 start app.js --name gcp-tf-sample-app
            sudo pm2 save
 
            echo "===== Deployment complete ====="
            sudo pm2 status
          '
 
substitutions:
  _VM_NAME: 'YOUR_VM_NAME'
  _VM_ZONE: 'YOUR_VM_ZONE'
  _VM_USER: 'YOUR_USERNAME'
 
options:
  logging: CLOUD_LOGGING_ONLY
