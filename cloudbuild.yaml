steps:
 
  # Single step - deploy via gcloud compute ssh (no key management needed)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-to-vm'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh ${_VM_USER}@${_VM_NAME} \
          --zone=${_VM_ZONE} \
          --tunnel-through-iap \
          --ssh-flag="-o StrictHostKeyChecking=no" \
          --command='
            set -e
            echo "===== Deployment started ====="
 
            rm -rf /opt/app
            git clone https://github.com/ncravikiran/gcp-tf.git /opt/app
            cd /opt/app
            git checkout cloud-build
            cd /opt/app/sample-code
 
            npm install
 
            set -a
            source /opt/app.env
            set +a
 
            pm2 delete gcp-tf-sample-app || true
            pm2 start app.js --name gcp-tf-sample-app
            pm2 save
 
            echo "===== Deployment complete ====="
            pm2 status
          '
 
substitutions:
  _VM_NAME: 'YOUR_VM_NAME'
  _VM_ZONE: 'YOUR_VM_ZONE'   # e.g. us-central1-a
  _VM_USER: 'YOUR_LINUX_USERNAME'
 
options:
  logging: CLOUD_LOGGING_ONLY
